# The annotations below are what let this ServiceAccount BE the UAMI, as far
# as Azure AD token issuance is concerned. AZURE_CLIENT_ID and AZURE_TENANT_ID
# get filled in by scripts/deploy.sh from `terraform output`.
#
# client-id / tenant-id here + the federated identity credential's subject
# (system:serviceaccount:ideahub:ideahub-sa, set in terraform/identity.tf)
# together form the two-sided trust: Azure trusts THIS service account's
# tokens, and the azure-wi-webhook (installed by AKS because
# workload_identity_enabled = true) knows which UAMI to request a token as.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ideahub-sa
  namespace: ideahub
  annotations:
    azure.workload.identity/client-id: "672196fe-0f37-40ed-8019-90947db27234"
